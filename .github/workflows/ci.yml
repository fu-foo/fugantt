# What can be checked without a browser.
#
# The grid's own suite drives a real Chrome against a running server, which is
# the only honest way to test it and not something to fake here. It runs on a
# developer's machine; this keeps the parts that do not need one honest.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable && rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
