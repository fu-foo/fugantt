# What can be checked without a browser.
#
# The grid's own suite drives a real Chrome against a running server, which is
# the only honest way to test it and not something to fake here. It runs on a
# developer's machine; this keeps the parts that do not need one honest.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable && rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The calendar promises to stand on nothing, and to meet either date
      # library when asked. Both are easy to break without noticing.
      - run: cargo test -p fu-calendar --all-features
      - run: cargo tree -p fu-calendar --edges normal --depth 1
      # fugantt always turns `sqlx` on, so nothing else would notice the core
      # no longer building without it.
      - run: cargo test -p fu-gantt-core --no-default-features
