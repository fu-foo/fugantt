# Builds the binaries a release is made of.
#
# `web/dist` is in the repository, so every job here is plain `cargo build` —
# no Node step, and nothing that can drift between a developer's machine and
# this one.

name: release

on:
  push:
    tags: ["v*"]
  # So the build can be proved without cutting a release.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: fugantt-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: fugantt-macos-arm64
          # Cross-compiled on Apple Silicon: the Intel runners are being
          # retired, and a job that waits for one waits for ever.
          - os: macos-latest
            target: x86_64-apple-darwin
            name: fugantt-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: fugantt-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable && rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The licence travels with the binary: Apache-2.0 asks for it, and a
      # download that arrives without one is a download nobody can use at work.
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p out/${{ matrix.name }}
          cp target/${{ matrix.target }}/release/fugantt out/${{ matrix.name }}/
          cp LICENSE NOTICE README.md README.en.md out/${{ matrix.name }}/
          tar -C out -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Path out/${{ matrix.name }} | Out-Null
          Copy-Item target/${{ matrix.target }}/release/fugantt.exe out/${{ matrix.name }}/
          Copy-Item LICENSE,NOTICE,README.md,README.en.md out/${{ matrix.name }}/
          Compress-Archive -Path out/${{ matrix.name }} -DestinationPath ${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip

  # Built from source in the image rather than copying the binary above: the
  # Dockerfile in the repository is the one people read, and an image that is
  # made some other way is a second thing to keep true.
  image:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags
        id: tags
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "tags=ghcr.io/${{ github.repository }}:$version,ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # amd64 only. An arm64 image would be built under emulation here, and
          # a Rust release build in QEMU takes long enough to make a release
          # something nobody wants to cut.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true
