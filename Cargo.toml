[package]
name = "fugantt"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A Gantt chart built around Japanese practice: plan against actual, counted in working days."
readme = "README.md"
repository = "https://github.com/fu-foo/fugantt"
homepage = "https://github.com/fu-foo/fugantt"
authors = ["Kazunari Fukagawa"]

[dependencies]
argon2 = "0.5"
futures-core = "0.3.34"
futures-util = "0.3.34"
jiff = "0.2.35"
rust_xlsxwriter = "0.97.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.5", features = ["tailwind", "multipart", "sse"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
# `default-features = false` keeps the build script off the server stack.
topcoat = { version = "0.5", default-features = false, features = ["tailwind"] }
