[workspace]
resolver = "3"
members = ["apps/fugantt", "crates/fu-calendar", "crates/fu-gantt-core", "crates/fu-gantt-web", "examples/minimal-host"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/fu-foo/fugantt"
homepage = "https://github.com/fu-foo/fugantt"
authors = ["Kazunari Fukagawa"]

[workspace.dependencies]
jiff = "0.2.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false }
