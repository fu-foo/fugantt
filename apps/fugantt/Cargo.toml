[package]
name = "fugantt"
version = "1.0.1"
description = "A Gantt chart built around Japanese practice: plan against actual, counted in working days."
readme = "../../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
argon2 = "0.5"
# Named directly for the request parts a layer reads; already in the tree
# under topcoat.
http = "1"
futures-core = "0.3.34"
futures-util = "0.3.34"
jiff.workspace = true
rust_xlsxwriter = "0.97.1"
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.5", features = ["tailwind", "multipart", "sse"] }
uuid = { version = "1", features = ["v4"] }
http-body-util = "0.1"

[build-dependencies]
# `default-features = false` keeps the build script off the server stack.
topcoat = { version = "0.5", default-features = false, features = ["tailwind"] }
